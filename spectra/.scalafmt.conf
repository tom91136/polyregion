version = "3.8.6"
runner.dialect = scala3
style = defaultWithAlign
maxColumn = 120
align.preset = more
rewrite.rules = [AvoidInfix, RedundantBraces, RedundantParens, AsciiSortImports, PreferCurlyFors]
rewrite.neverInfix.excludeFilters = [until, to, by, eq, ne, synchronized]

fileOverride {
  "glob:**/*.sbt" { runner.dialect = scala3 }
}
