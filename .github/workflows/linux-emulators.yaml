name: Linux emulators

on:
  workflow_call:
    outputs:
      archs:
        value: ${{ jobs.arch-status.outputs.archs }}
      missing-archs:
        value: ${{ jobs.arch-status.outputs.missing-archs }}

defaults:
  run:
    shell: bash

jobs:
  build-emulators:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs_on: ubuntu-24.04
          - arch: aarch64
            runs_on: ubuntu-24.04-arm
    outputs:
      x86_64: ${{ steps.built.outputs.x86_64 || steps.started.outputs.x86_64 }}
      aarch64: ${{ steps.built.outputs.aarch64 || steps.started.outputs.aarch64 }}
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Mark leg started
        id: started
        run: echo "${{ matrix.arch }}=started" >> "$GITHUB_OUTPUT"

      - name: Free up disk space
        if: ${{ !env.ACT }}
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          cleanup-profile: custom
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-dotnet: 'true'

      - uses: actions/checkout@v6
      - name: Setup just
        uses: ./.github/actions/setup-just

      - name: Restore emulators cache
        if: ${{ !env.ACT }}
        id: restore-emu
        uses: ./.github/actions/restore-compressed-cache
        with:
          path: &emu-path emulators/out
          archive: &emu-archive emulators/out.tar.zst
          key: &emu-key emulators-linux-${{ matrix.arch }}-${{ hashFiles('./emulators/inputs.sh', './emulators/Dockerfile', './emulators/collect.sh', './emulators/spirv-tools.ref', './emulators/gpuocelot.patch', './emulators/mesa.patch') }}

      - name: Detect existing emulators (act fast-path)
        if: ${{ env.ACT }}
        id: act-emu-probe
        run: |
          bash emulators/check_inputs.sh emulators/out 2>/dev/null && echo "found=true" >> "$GITHUB_OUTPUT" || true

      - name: Build emulators
        id: build-emulators
        if: steps.restore-emu.outputs.cache-hit != 'true' && steps.act-emu-probe.outputs.found != 'true'
        env:
          CONTAINER: docker
        run: just build-emulators

      - name: Save emulators cache
        if: ${{ !env.ACT && github.ref == 'refs/heads/main' && steps.build-emulators.outcome == 'success' }}
        uses: ./.github/actions/save-compressed-cache
        with:
          path: *emu-path
          archive: *emu-archive
          key: *emu-key

      - name: Pack emulators (tar preserves symlinks)
        run: tar czf emulators-out.tar.gz -C emulators out

      - name: Upload emulators artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: polyregion-emulators-linux-${{ matrix.arch }}
          path: emulators-out.tar.gz
          if-no-files-found: error

      - name: Mark leg built
        id: built
        run: echo "${{ matrix.arch }}=built" >> "$GITHUB_OUTPUT"

  arch-status:
    needs: build-emulators
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    outputs:
      archs: ${{ steps.status.outputs.archs }}
      missing-archs: ${{ steps.status.outputs.missing-archs }}
    steps:
      - name: Collect arch status
        id: status
        env:
          LEGS: ${{ toJSON(needs.build-emulators.outputs) }}
        run: |
          archs=$(echo "$LEGS" | jq -c '[to_entries[] | select(.value == "built") | .key]')
          missing=$(echo "$LEGS" | jq -c '[to_entries[] | select(.value == "started") | .key]')
          {
            echo "archs=$archs"
            echo "missing-archs=$missing"
          } >> "$GITHUB_OUTPUT"
