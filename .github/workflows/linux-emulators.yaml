name: Linux emulators

on:
  workflow_call:
    outputs:
      archs:
        value: ${{ jobs.artifacts.outputs.archs }}
      missing-archs:
        value: ${{ jobs.artifacts.outputs.missing-archs }}

defaults:
  run:
    shell: bash

jobs:
  build-emulators:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs_on: ubuntu-24.04
          - arch: aarch64
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Free up disk space
        if: ${{ !env.ACT }}
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          cleanup-profile: custom
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-dotnet: 'true'

      - uses: actions/checkout@v6
      - name: Setup just
        uses: ./.github/actions/setup-just

      - name: Restore emulators cache
        if: ${{ !env.ACT }}
        id: restore-emu
        uses: ./.github/actions/restore-compressed-cache
        with:
          path: &emu-path emulators/out
          archive: &emu-archive emulators/out.tar.zst
          key: &emu-key emulators-linux-${{ matrix.arch }}-${{ hashFiles('./emulators/inputs.sh', './emulators/Dockerfile', './emulators/collect.sh', './emulators/gpuocelot.patch', './emulators/mesa.patch') }}

      - name: Detect existing emulators (act fast-path)
        if: ${{ env.ACT }}
        id: act-emu-probe
        run: |
          bash emulators/check_inputs.sh emulators/out 2>/dev/null && echo "found=true" >> "$GITHUB_OUTPUT" || true

      - name: Build emulators
        id: build-emulators
        if: steps.restore-emu.outputs.cache-hit != 'true' && steps.act-emu-probe.outputs.found != 'true'
        env:
          CONTAINER: docker
        run: just build-emulators

      - name: Save emulators cache
        if: github.ref == 'refs/heads/main' && steps.build-emulators.outcome == 'success'
        uses: ./.github/actions/save-compressed-cache
        with:
          path: *emu-path
          archive: *emu-archive
          key: *emu-key

      - name: Pack emulators (tar preserves symlinks)
        run: tar czf emulators-out.tar.gz -C emulators out

      - name: Upload emulators artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: polyregion-emulators-linux-${{ matrix.arch }}
          path: emulators-out.tar.gz
          if-no-files-found: error

  artifacts:
    needs: build-emulators
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      archs: ${{ steps.list.outputs.archs }}
      missing-archs: ${{ steps.list.outputs.missing-archs }}
    steps:
      - name: List artifacts
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          known=$(printf '%s\n' x86_64 aarch64 | sort)
          names=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].name')
          archs=$(printf '%s\n' "$names" | jq -R -s -c --arg prefix polyregion-emulators-linux- --arg known "$known" '
            split("\n")
            | map(select(startswith($prefix)) | ltrimstr($prefix))
            | map(select(. as $arch | ($known | split("\n")) | index($arch)))')
          missing=$(comm -23 <(printf '%s\n' "$known") <(printf '%s\n' "$archs" | jq -r '.[]' | sort) |
            jq -R -s -c 'split("\n") | map(select(length > 0))')
          {
            echo "archs=$archs"
            echo "missing-archs=$missing"
          } >> "$GITHUB_OUTPUT"
