name: CI

on:
  pull_request:
  push:
  release:
    types: published
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yaml

  linux-build:
    uses: ./.github/workflows/linux-build.yaml

  linux-emulators:
    uses: ./.github/workflows/linux-emulators.yaml

  linux-test:
    needs: linux-build
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/linux-test.yaml
    with:
      archs: ${{ needs.linux-build.outputs.archs }}

  linux-emulator-test:
    needs: [linux-build, linux-emulators]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/linux-emulator-test.yaml
    with:
      shards: ${{ needs.linux-build.outputs.shards }}
      archs: ${{ needs.linux-build.outputs.archs }}
      emulator-test-archs: ${{ needs.linux-build.outputs.emulator-test-archs }}

  macos-build:
    uses: ./.github/workflows/macos-build.yaml

  macos-emulators:
    uses: ./.github/workflows/macos-emulators.yaml

  macos-test:
    needs: macos-build
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/macos-test.yaml
    with:
      archs: ${{ needs.macos-build.outputs.archs }}

  macos-emulator-test:
    needs: [macos-build, macos-emulators]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/macos-emulator-test.yaml
    with:
      shards: ${{ needs.macos-build.outputs.shards }}
      emulator-test-archs: ${{ needs.macos-build.outputs.emulator-test-archs }}

  windows-build:
    uses: ./.github/workflows/windows-build.yaml

  windows-emulators:
    uses: ./.github/workflows/windows-emulators.yaml

  windows-test:
    needs: windows-build
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/windows-test.yaml
    with:
      archs: ${{ needs.windows-build.outputs.archs }}

  windows-emulator-test:
    needs: [windows-build, windows-emulators]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/windows-emulator-test.yaml
    with:
      shards: ${{ needs.windows-build.outputs.shards }}
      emulator-test-archs: ${{ needs.windows-build.outputs.emulator-test-archs }}

  cross-build:
    uses: ./.github/workflows/cross-build.yaml

  cross-test:
    needs: [cross-build, linux-build]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/cross-test.yaml
    with:
      shards: ${{ needs.linux-build.outputs.shards }}
      test-archs: ${{ needs.cross-build.outputs.test-archs }}

  spectra-vendor:
    uses: ./.github/workflows/spectra-vendor.yaml

  spectra-surface:
    needs: linux-build
    if: ${{ !cancelled() && contains(fromJSON(needs.linux-build.outputs.archs || '[]'), 'x86_64') }}
    uses: ./.github/workflows/spectra-surface.yaml

  spectra-test-linux:
    name: spectra-test-linux
    needs: [linux-build, linux-emulators]
    if: ${{ !cancelled() && needs.linux-build.outputs.spectra-package != '' && needs.linux-build.outputs.archs != '' && needs.linux-build.outputs.archs != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.linux-build.outputs.archs) }}
    uses: ./.github/workflows/spectra-test.yaml
    with:
      os: linux
      arch: ${{ matrix.arch }}
      runs_on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}

  spectra-test-macos:
    name: spectra-test-macos
    needs: [macos-build, macos-emulators, linux-build]
    if: ${{ !cancelled() && needs.linux-build.outputs.spectra-package != '' && needs.macos-build.outputs.archs != '' && needs.macos-build.outputs.archs != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.macos-build.outputs.archs) }}
    uses: ./.github/workflows/spectra-test.yaml
    with:
      os: darwin
      arch: ${{ matrix.arch }}
      runs_on: ${{ matrix.arch == 'x86_64' && 'macos-26-intel' || 'macos-26' }}

  spectra-test-windows:
    name: spectra-test-windows
    needs: [windows-build, windows-emulators, linux-build]
    if: ${{ !cancelled() && needs.linux-build.outputs.spectra-package != '' && needs.windows-build.outputs.archs != '' && needs.windows-build.outputs.archs != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.windows-build.outputs.archs) }}
    uses: ./.github/workflows/spectra-test.yaml
    with:
      os: windows
      arch: ${{ matrix.arch }}
      runs_on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-2025-vs2026' }}

  spectra-test-cross:
    needs: [cross-build, linux-build]
    if: ${{ !cancelled() && needs.linux-build.outputs.spectra-package != '' && needs.cross-build.outputs.archs != '' && needs.cross-build.outputs.archs != '[]' }}
    uses: ./.github/workflows/spectra-test-cross.yaml
    with:
      archs: ${{ needs.cross-build.outputs.archs }}

  test-report:
    if: always()
    needs:
      - linux-build
      - macos-build
      - windows-build
      - cross-build
      - linux-test
      - linux-emulator-test
      - macos-test
      - macos-emulator-test
      - windows-test
      - windows-emulator-test
      - cross-test
      - spectra-test-linux
      - spectra-test-macos
      - spectra-test-windows
      - spectra-test-cross
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
      - name: Download test results
        uses: actions/download-artifact@v8
        with:
          pattern: '*-test-results-*'
          path: test-results
      - name: Write test summary
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 -I .github/scripts/junit_summary.py summary test-results >> "$GITHUB_STEP_SUMMARY"
