name: macOS build

on:
  workflow_call:
    outputs:
      shards:
        value: ${{ jobs.discover-shards.outputs.shards }}

jobs:
  build-llvm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runs_on: macos-26
            llvm_parallel_compile_jobs: "3"
            llvm_parallel_link_jobs: "3"
            flang_parallel_compile_jobs: "1"
          - arch: x86_64
            runs_on: macos-26
            llvm_parallel_compile_jobs: "3"
            llvm_parallel_link_jobs: "3"
            flang_parallel_compile_jobs: "1"
    runs-on: ${{ matrix.runs_on }}
    env:
      POLYREGION_ARCH: ${{ matrix.arch }}
      POLYREGION_LLVM_PARALLEL_COMPILE_JOBS: ${{ matrix.llvm_parallel_compile_jobs }}
      POLYREGION_LLVM_PARALLEL_LINK_JOBS: ${{ matrix.llvm_parallel_link_jobs }}
      POLYREGION_FLANG_PARALLEL_COMPILE_JOBS: ${{ matrix.flang_parallel_compile_jobs }}
    steps:
      - uses: &checkout actions/checkout@v6
      - &setup-java
        name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          if brew tap | grep -qx 'aws/tap'; then brew untap aws/tap; fi
          brew install --quiet llvm lld cmake ninja zlib gcc
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - &sdkroot
        name: Pin the SDK to the selected Xcode
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Dotenv
        id: dotenv
        uses: falti/dotenv-action@v1.2
        with:
          path: ./native/.env

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "${{ steps.dotenv.outputs.vcpkg_commit }}"

      - &setup-just
        name: Setup just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Restore LLVM cache
        if: ${{ !env.ACT }}
        id: restore-llvm
        uses: ./.github/actions/restore-compressed-cache
        with:
          path: &llvm-path native/out/polyregion-Release-${{ matrix.arch }}-dylib-dist
          archive: &llvm-archive native/out/llvm-${{ matrix.arch }}-dist.tar.zst
          key: &llvm-key llvm-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-${{ hashFiles('./native/build_llvm.cmake', './native/build_llvm_cache.cmake', './native/ProjectConfig.cmake', './native/build.cmake', './native/toolchains/*.cmake', './native/llvm-patches/*.patch', './native/llvm-patches-*/*.patch') }}

      - name: Build LLVM
        id: build-llvm
        if: steps.restore-llvm.outputs.cache-hit != 'true'
        run: just build-llvm

      - name: Save LLVM cache
        if: steps.build-llvm.outcome == 'success'
        uses: ./.github/actions/save-compressed-cache
        with:
          path: *llvm-path
          archive: *llvm-archive
          key: *llvm-key

      - name: Pack LLVM dist
        run: tar czf llvm-dist.tar.gz -C native/out polyregion-Release-${{ matrix.arch }}-dylib-dist

      - name: Upload LLVM
        if: ${{ !env.ACT }}
        uses: &upload actions/upload-artifact@v7
        with:
          name: polyregion-llvm-darwin-${{ matrix.arch }}
          path: llvm-dist.tar.gz
          compression-level: 0
          if-no-files-found: error

  build:
    needs: build-llvm
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runs_on: macos-26
          - arch: x86_64
            runs_on: macos-26
    runs-on: ${{ matrix.runs_on }}
    env:
      POLYREGION_ARCH: ${{ matrix.arch }}
      POLYC_PASS_BUNDLE: dso
    steps:
      - uses: *checkout
      - *setup-java

      - name: Install dependencies
        # gcc brings gfortran which flang-rt needs at LLVM-runtimes configure time.
        run: |
          if brew tap | grep -qx 'aws/tap'; then brew untap aws/tap; fi
          brew install --quiet llvm lld cmake ninja zlib gcc sbt
          echo "$(brew --prefix llvm)/bin"          >> "$GITHUB_PATH"
      - *sdkroot

      - name: Dotenv
        id: dotenv
        uses: falti/dotenv-action@v1.2
        with:
          path: ./native/.env

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "${{ steps.dotenv.outputs.vcpkg_commit }}"

      - name: Check environment
        run: |
          clang --version
          llvm-tblgen --version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "VCPKG_ROOT=$VCPKG_ROOT"

      - name: Download LLVM
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v8
        with:
          name: polyregion-llvm-darwin-${{ matrix.arch }}
          path: .

      - name: Unpack LLVM
        if: ${{ !env.ACT }}
        run: |
          mkdir -p native/out
          tar xzf llvm-dist.tar.gz -C native/out

      - *setup-just

      - name: Restore device libs cache
        if: ${{ !env.ACT }}
        id: restore-device-libs
        uses: &cache-restore actions/cache/restore@v5
        with:
          path: &devlibs-path ./native/thirdparty/device_libs
          key: &devlibs-key device-libs-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-${{ hashFiles('./native/cmake/prepare_*_dist.cmake', './native/build_llvm.cmake', './native/build_llvm_cache.cmake', './native/ProjectConfig.cmake', './native/build.cmake', './native/toolchains/*.cmake', './native/llvm-patches/*.patch', './native/llvm-patches-*/*.patch') }}

      - name: Build device libs
        id: build-device-libs
        if: steps.restore-device-libs.outputs.cache-hit != 'true'
        run: just build-device-libs

      - name: Save device libs cache
        if: steps.build-device-libs.outcome == 'success'
        uses: &cache-save actions/cache/save@v5
        with:
          path: *devlibs-path
          key: *devlibs-key

      - name: Restore vcpkg cache
        if: ${{ !env.ACT }}
        id: restore-vcpkg
        uses: *cache-restore
        with:
          path: &vcpkg-path ./native/.vcpkg/vcpkg_installed
          key: &vcpkg-key vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-${{ hashFiles('./native/vcpkg.json', './native/vcpkg-configuration.json', './native/toolchains/*.cmake', './native/.env', './native/ports/**') }}

      - name: Install vcpkg dependencies
        id: build-vcpkg
        if: steps.restore-vcpkg.outputs.cache-hit != 'true'
        run: just build-vcpkg-deps

      - name: Save vcpkg cache
        if: steps.build-vcpkg.outcome == 'success'
        uses: *cache-save
        with:
          path: *vcpkg-path
          key: *vcpkg-key

      - name: Build pass bundle (dso)
        run: just build-pass-native

      - name: Build JVM SDK
        run: just build-jvm-sdk

      - name: Configure release build
        run: just configure

      - name: Build dist
        run: just build-dist

      - name: Build test dist
        run: just build-test-dist

      - name: Check artefact
        if: always()
        run: just check-dist-deps native/out/polyregion-Release-${{ matrix.arch }}-dylib-dist

      - name: Upload dist
        # v4: nektos/act#6022
        uses: *upload
        with:
          name: polyregion-darwin-${{ matrix.arch }}-Release
          path: ./native/out/polyregion-Release-${{ matrix.arch }}-dylib-dist/**
          if-no-files-found: error

      - name: Upload test dist
        # v4: nektos/act#6022
        uses: *upload
        with:
          name: polyregion-tests-darwin-${{ matrix.arch }}-Release
          path: ./native/out/polyregion-test-Release-${{ matrix.arch }}-dylib-dist/**
          if-no-files-found: error

      - name: Build test dist (emulators profile)
        env:
          POLYREGION_TEST_PROFILE: emulators
        run: |
          just build-test-dist

      - name: Upload test dist (emulators)
        uses: *upload
        with:
          name: polyregion-tests-emulators-darwin-${{ matrix.arch }}-Release
          path: ./native/out/polyregion-test-Release-${{ matrix.arch }}-dylib-dist/**
          if-no-files-found: error

      - name: List shards
        run: just list-shards emulators > shards.txt

      - name: Upload shards
        uses: *upload
        with:
          name: polyregion-shards-darwin-${{ matrix.arch }}
          path: shards.txt
          if-no-files-found: error

  discover-shards:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
    steps:
      - name: Download shards
        uses: actions/download-artifact@v8
        with:
          name: polyregion-shards-darwin-arm64
          path: .
      - id: gen
        name: Build shard matrix
        run: |
          shards=$(jq -R -s -c '[split("\n")[] | select(length > 0)]' shards.txt)
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "shards: $shards"
