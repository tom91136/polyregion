name: Spectra cross test

on:
  workflow_call:
    inputs:
      archs:
        type: string
        required: true

defaults:
  run:
    shell: bash
    working-directory: spectra

jobs:
  # Proves the package imports and its cases run on the host under QEMU for every architecture Polyregion ships.
  test-cross:
    name: test-cross (${{ matrix.arch }})
    if: ${{ !cancelled() && inputs.archs != '' && inputs.archs != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.archs) }}
    runs-on: ubuntu-24.04-arm
    env:
      POLYREGION_ARCH: ${{ matrix.arch }}
      SYSROOT_VARIANT: ${{ matrix.arch == 'ppc64le' && 'al8' || 'ubuntu20' }}
      SYSROOT_DOCKERFILE: ${{ matrix.arch == 'ppc64le' && 'Dockerfile' || 'Dockerfile.ubuntu' }}
      POLYREGION_DIST: ${{ github.workspace }}/dist
      POLYREGION_TEST_TARGETS: host@native!host@*
    steps:
      - uses: actions/checkout@v6

      - name: Setup just
        uses: ./.github/actions/setup-just

      - name: Install dependencies
        env:
          APT_OPTIONS: -qq -o Acquire::Retries=10 -o Acquire::Retries::Delay::Maximum=60 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
        run: |
          sudo apt-get ${{ env.APT_OPTIONS }} update
          sudo apt-get ${{ env.APT_OPTIONS }} install -y cmake ninja-build

      - name: Register binfmt-misc for ${{ matrix.arch }}
        run: bash ../ci/install_qemu.sh ${{ matrix.arch }}

      - name: Restore sysroot cache
        uses: actions/cache/restore@v5
        with:
          path: ./sysroot/out/sysroot-${{ env.SYSROOT_VARIANT }}-${{ matrix.arch }}.tar.xz
          key: sysroot-${{ env.SYSROOT_VARIANT }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-${{ hashFiles(format('./sysroot/{0}', env.SYSROOT_DOCKERFILE), './sysroot/build.sh') }}

      - name: Prepare sysroot
        working-directory: .
        run: |
          [ -n "$(ls sysroot/out/sysroot-*-${{ matrix.arch }}.tar.xz 2>/dev/null)" ] || CONTAINER=docker just build-sysroot
          just prepare-sysroot
          SYSROOT="$PWD/sysroot/out/${{ matrix.arch }}"
          {
            echo "POLYREGION_SYSROOT=$SYSROOT"
            echo "QEMU_LD_PREFIX=$SYSROOT"
          } >> "$GITHUB_ENV"

      - name: Download Polyregion
        if: ${{ !env.ACT }}
        uses: &download actions/download-artifact@v8
        with:
          name: polyregion-linux-${{ matrix.arch }}-Release
          path: ${{ env.POLYREGION_DIST }}

      - name: Download the package
        if: ${{ !env.ACT }}
        uses: *download
        with:
          name: spectra-package
          path: package

      - name: Link artifacts from the bound workspace
        if: ${{ env.ACT }}
        working-directory: .
        run: |
          dist="$PWD/native/out/polyregion-Release-${{ matrix.arch }}-dylib-dist"
          ln -sfnT "$dist" "$POLYREGION_DIST"
          ln -sfnT "$dist/lib/polyregion/packages" package

      - name: Shim the dist for QEMU
        working-directory: .
        run: |
          just restore-exec-bits "$POLYREGION_DIST"
          ci/qemu_shim.sh "${{ matrix.arch }}" "$POLYREGION_DIST" "$POLYREGION_SYSROOT"

      - name: Compile the smoke cases under QEMU
        run: |
          cmake -S . -B target/cross -G Ninja -DCMAKE_BUILD_TYPE=Release -DSPECTRA_ENABLE_PACKAGE=ON \
            -DSPECTRA_PREBUILT_PACKAGE="$GITHUB_WORKSPACE/package/spectra/lib.polyast" -DCMAKE_PREFIX_PATH="$POLYREGION_DIST"
          cmake --build target/cross --target spectra-test-discover
          rc=0
          ctest --test-dir target/cross --timeout 3600 --output-on-failure --no-tests=error --parallel 2 \
            --output-junit results.xml -R '^spectra-offload-(equal|none_of)-' || rc=$?
          "$POLYREGION_DIST/bin/polytest" --skip-report target/cross/results.xml || [ "$rc" -ne 0 ] || rc=1
          exit "$rc"
