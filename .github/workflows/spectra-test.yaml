name: Spectra test

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      arch:
        type: string
        required: true
      runs_on:
        type: string
        required: true

defaults:
  run:
    shell: bash
    working-directory: spectra

jobs:
  slices:
    name: slices (${{ inputs.arch }})
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 7
    outputs:
      slices: ${{ steps.gen.outputs.slices }}
    env:
      POLYREGION_DIST: ${{ github.workspace }}/dist
      SPECTRA_PACKAGE: ${{ github.workspace }}/package/spectra/lib.polyast
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-spectra-test
        with:
          os: ${{ inputs.os }}
          arch: ${{ inputs.arch }}

      - name: List slices
        run: just list-slices "-DSPECTRA_PREBUILT_PACKAGE=${SPECTRA_PACKAGE//\\//}" > slices.txt

      - id: gen
        name: Build slice matrix
        working-directory: .
        run: |
          slices=$(awk -F'\t' 'NF == 3 { sub(/\r$/, "", $3); printf "%s{\"id\":\"%s\",\"shard\":\"%s\",\"labels\":\"%s\"}", sep, $1, $2, $3; sep = "," }' spectra/slices.txt)
          echo "slices=[$slices]" >> "$GITHUB_OUTPUT"
          echo "slices: [$slices]"

  test:
    needs: slices
    if: ${{ !cancelled() && needs.slices.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJSON(needs.slices.outputs.slices) }}
    name: test (${{ inputs.arch }}, ${{ matrix.slice.id }})
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 225
    env:
      POLYREGION_DIST: ${{ github.workspace }}/dist
      EMULATORS: ${{ github.workspace }}/emulators/out
      SPECTRA_PACKAGE: ${{ github.workspace }}/package/spectra/lib.polyast
      # macOS runners may or may not expose a paravirtualised Metal device
      POLYRT_STRICT_SELECT: ${{ inputs.os == 'darwin' && '0' || '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-spectra-test
        with:
          os: ${{ inputs.os }}
          arch: ${{ inputs.arch }}
          emulators: 'true'

      - name: Run package-import tests (${{ matrix.slice.id }}) on emulators
        env:
          POLYTEST_SLICE: ${{ matrix.slice.labels }}
        run: just test-package '' "-DSPECTRA_PREBUILT_PACKAGE=${SPECTRA_PACKAGE//\\//}" --no-tests=error "spectra-test-results-${{ matrix.slice.id }}.xml"

      - name: Annotate ctest results
        if: always()
        uses: ./.github/actions/annotate-junit
        with:
          junit: spectra/target/package/spectra-test-results-${{ matrix.slice.id }}.xml
          label: ctest-spectra-${{ matrix.slice.id }}

      - name: Upload test results
        continue-on-error: true
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: spectra-test-results-${{ inputs.os }}-${{ inputs.arch }}-${{ matrix.slice.id }}
          path: spectra/target/package/spectra-test-results-${{ matrix.slice.id }}.xml
          if-no-files-found: warn

  test-misc:
    needs: slices
    if: ${{ !cancelled() && needs.slices.result == 'success' }}
    name: test-misc (${{ inputs.arch }})
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 11
    env:
      POLYREGION_DIST: ${{ github.workspace }}/dist
      SPECTRA_PACKAGE: ${{ github.workspace }}/package/spectra/lib.polyast
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-spectra-test
        with:
          os: ${{ inputs.os }}
          arch: ${{ inputs.arch }}

      - name: Run misc tests (non-codegen)
        run: just test-package '' "-DSPECTRA_PREBUILT_PACKAGE=${SPECTRA_PACKAGE//\\//}" "-LE codegen --no-tests=error" spectra-test-results-misc.xml

      - name: Annotate ctest results
        if: always()
        uses: ./.github/actions/annotate-junit
        with:
          junit: spectra/target/package/spectra-test-results-misc.xml
          label: ctest-spectra-misc

      - name: Upload test results
        continue-on-error: true
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: spectra-test-results-${{ inputs.os }}-${{ inputs.arch }}-misc
          path: spectra/target/package/spectra-test-results-misc.xml
          if-no-files-found: warn
