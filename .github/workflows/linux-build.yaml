name: Linux build

on:
  workflow_call:
    outputs:
      shards:
        value: ${{ jobs.discover-shards.outputs.shards }}
      spectra-package:
        value: ${{ jobs.build.outputs.spectra-package }}

defaults:
  run:
    shell: bash

env:
  # AL8 = glibc 2.28, gcc-toolset-12 libstdc++. Cross-only archs (riscv64, arm) live in cross-build.yaml.
  SYSROOT_VARIANT: al8
  POLYREGION_LLVM_PGO_BOLT: "ON"
  APT_OPTIONS: -o Acquire::Retries=10 -o Acquire::Retries::Delay::Maximum=60 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30

jobs:
  build-llvm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs_on: ubuntu-24.04
            llvm_parallel_compile_jobs: "4"
            llvm_parallel_link_jobs: "2"    # XXX 4x lld @ ~4 GB OOMs
            flang_parallel_compile_jobs: "2"
          - arch: aarch64
            runs_on: ubuntu-24.04-arm
            llvm_parallel_compile_jobs: "4"
            llvm_parallel_link_jobs: "4"
            flang_parallel_compile_jobs: "3"
    runs-on: ${{ matrix.runs_on }}
    env:
      POLYREGION_ARCH: ${{ matrix.arch }}
      POLYREGION_LLVM_PARALLEL_COMPILE_JOBS: ${{ matrix.llvm_parallel_compile_jobs }}
      POLYREGION_LLVM_PARALLEL_LINK_JOBS: ${{ matrix.llvm_parallel_link_jobs }}
      POLYREGION_FLANG_PARALLEL_COMPILE_JOBS: ${{ matrix.flang_parallel_compile_jobs }}
    steps:
      - &free-disk
        name: Free up disk space
        if: ${{ !env.ACT }}
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          cleanup-profile: custom
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-dotnet: 'true'

      - uses: &checkout actions/checkout@v6

      - name: Max parallelism under act
        if: ${{ env.ACT }}
        run: |
          {
            echo "POLYREGION_LLVM_PARALLEL_COMPILE_JOBS="
            echo "POLYREGION_LLVM_PARALLEL_LINK_JOBS="
            echo "POLYREGION_FLANG_PARALLEL_COMPILE_JOBS="
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get ${{ env.APT_OPTIONS }} update
          sudo apt-get ${{ env.APT_OPTIONS }} install -y cmake ninja-build clang clang-tools lld llvm g++ gfortran libcrypt-dev libltdl-dev zlib1g-dev python3-requests

      - name: Dotenv
        id: dotenv
        uses: falti/dotenv-action@v1.2
        with:
          path: ./native/.env

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "${{ steps.dotenv.outputs.vcpkg_commit }}"

      - &setup-just
        name: Setup just
        uses: ./.github/actions/setup-just

      - name: Restore sysroot cache
        if: ${{ !env.ACT }}
        id: restore-sysroot
        uses: &cache-restore actions/cache/restore@v5
        with:
          path: &sysroot-path ./sysroot/out/sysroot-${{ env.SYSROOT_VARIANT }}-${{ matrix.arch }}.tar.xz
          key: &sysroot-key sysroot-${{ env.SYSROOT_VARIANT }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-${{ hashFiles('./sysroot/Dockerfile', './sysroot/build.sh') }}

      - name: Build sysroot
        id: build-sysroot
        if: steps.restore-sysroot.outputs.cache-hit != 'true'
        env:
          CONTAINER: docker
        run: just build-sysroot

      - name: Save sysroot cache
        if: steps.build-sysroot.outcome == 'success'
        uses: &cache-save actions/cache/save@v5
        with:
          path: *sysroot-path
          key: *sysroot-key

      - name: Prepare sysroot
        run: |
          just prepare-sysroot
          echo "SYSROOT_PATH=$PWD/sysroot/out/${{ matrix.arch }}" >> "$GITHUB_ENV"

      - name: Restore LLVM cache
        if: ${{ !env.ACT }}
        id: restore-llvm
        uses: ./.github/actions/restore-compressed-cache
        with:
          path: &llvm-path native/out/polyregion-Release-${{ matrix.arch }}-dylib-dist
          archive: &llvm-archive native/out/llvm-${{ matrix.arch }}-dist.tar.zst
          key: &llvm-key llvm-pgobolt${{ env.POLYREGION_LLVM_PGO_BOLT }}-${{ env.SYSROOT_VARIANT }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-${{ hashFiles('./native/build_llvm.cmake', './native/build_llvm_cache.cmake', './native/ProjectConfig.cmake', './native/build.cmake', './native/toolchains/linux-*.cmake', '!./native/toolchains/*-asan.cmake', './native/cmake/sysroot_gcc_dir.cmake', './sysroot/Dockerfile', './native/llvm-patches/*.patch', './native/llvm-patches-*/*.patch') }}

      - name: Enable swap
        if: ${{ !env.ACT && steps.restore-llvm.outputs.cache-hit != 'true' }}
        run: sudo bash ci/enable_swap.sh

      - name: Build LLVM
        id: build-llvm
        if: steps.restore-llvm.outputs.cache-hit != 'true'
        run: just build-llvm

      - name: Save LLVM cache
        if: steps.build-llvm.outcome == 'success'
        uses: ./.github/actions/save-compressed-cache
        with:
          path: *llvm-path
          archive: *llvm-archive
          key: *llvm-key

      - name: Pack LLVM dist
        run: tar czf llvm-dist.tar.gz -C native/out polyregion-Release-${{ matrix.arch }}-dylib-dist

      - name: Upload LLVM
        if: ${{ !env.ACT }}
        uses: &upload actions/upload-artifact@v7
        with:
          name: polyregion-llvm-linux-${{ matrix.arch }}
          path: llvm-dist.tar.gz
          compression-level: 0
          if-no-files-found: error

  build:
    needs: build-llvm
    outputs:
      spectra-package: ${{ steps.upload-package.outputs.artifact-id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs_on: ubuntu-24.04
          - arch: aarch64
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}
    env:
      POLYREGION_ARCH: ${{ matrix.arch }}
      POLYC_PASS_BUNDLE: dso
    steps:
      - *free-disk

      - uses: *checkout

      - name: Max parallelism under act
        if: ${{ env.ACT }}
        run: |
          {
            echo "POLYREGION_LLVM_PARALLEL_COMPILE_JOBS="
            echo "POLYREGION_LLVM_PARALLEL_LINK_JOBS="
            echo "POLYREGION_FLANG_PARALLEL_COMPILE_JOBS="
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        # clang-tools provides clang-scan-deps (cmake >= 3.28 uses it for C++20 module deps).
        run: |
          sudo apt-get ${{ env.APT_OPTIONS }} update
          sudo apt-get ${{ env.APT_OPTIONS }} install -y cmake ninja-build clang clang-tools lld llvm g++ gfortran libcrypt-dev libltdl-dev zlib1g-dev python3-requests

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Dotenv
        id: dotenv
        uses: falti/dotenv-action@v1.2
        with:
          path: ./native/.env

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "${{ steps.dotenv.outputs.vcpkg_commit }}"

      - name: Check environment
        run: |
          clang --version
          llvm-tblgen --version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "VCPKG_ROOT=$VCPKG_ROOT"

      - *setup-just

      - name: Restore sysroot cache
        if: ${{ !env.ACT }}
        id: restore-sysroot
        uses: *cache-restore
        with:
          path: *sysroot-path
          key: *sysroot-key

      - name: Detect existing sysroot tarball (act fast-path)
        if: ${{ env.ACT }}
        id: act-sysroot-probe
        run: |
          [ -f sysroot/out/sysroot-${{ env.SYSROOT_VARIANT }}-${{ matrix.arch }}.tar.xz ] && echo "found=true" >> "$GITHUB_OUTPUT" || true

      - name: Build sysroot
        id: build-sysroot
        if: steps.restore-sysroot.outputs.cache-hit != 'true' && steps.act-sysroot-probe.outputs.found != 'true'
        env:
          CONTAINER: docker
        run: just build-sysroot

      - name: Save sysroot cache
        if: steps.build-sysroot.outcome == 'success'
        uses: *cache-save
        with:
          path: *sysroot-path
          key: *sysroot-key

      - name: Prepare sysroot
        run: |
          just prepare-sysroot
          echo "SYSROOT_PATH=$PWD/sysroot/out/${{ matrix.arch }}" >> "$GITHUB_ENV"

      - name: Download LLVM
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v8
        with:
          name: polyregion-llvm-linux-${{ matrix.arch }}
          path: .

      - name: Unpack LLVM
        if: ${{ !env.ACT }}
        run: |
          mkdir -p native/out
          tar xzf llvm-dist.tar.gz -C native/out

      - name: Detect existing device-libs (act fast-path)
        if: ${{ env.ACT }}
        id: act-cache-probe
        run: |
          [ -d native/thirdparty/device_libs ] && [ -n "$(ls -A native/thirdparty/device_libs 2>/dev/null)" ] && echo "device-libs=true" >> "$GITHUB_OUTPUT" || true

      - name: Restore device libs cache
        if: ${{ !env.ACT }}
        id: restore-device-libs
        uses: *cache-restore
        with:
          path: &devlibs-path ./native/thirdparty/device_libs
          key: &devlibs-key device-libs-${{ env.SYSROOT_VARIANT }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-${{ hashFiles('./native/cmake/prepare_*_dist.cmake', './native/build_llvm.cmake', './native/build_llvm_cache.cmake', './native/ProjectConfig.cmake', './native/build.cmake', './native/toolchains/linux-*.cmake', '!./native/toolchains/*-asan.cmake', './native/cmake/sysroot_gcc_dir.cmake', './sysroot/Dockerfile', './native/llvm-patches/*.patch', './native/llvm-patches-*/*.patch') }}

      - name: Build device libs
        id: build-device-libs
        if: steps.restore-device-libs.outputs.cache-hit != 'true' && steps.act-cache-probe.outputs.device-libs != 'true'
        run: just build-device-libs

      - name: Save device libs cache
        if: steps.build-device-libs.outcome == 'success'
        uses: *cache-save
        with:
          path: *devlibs-path
          key: *devlibs-key

      - name: Restore vcpkg cache
        if: ${{ !env.ACT }}
        id: restore-vcpkg
        uses: *cache-restore
        with:
          path: &vcpkg-path ./native/.vcpkg/vcpkg_installed
          key: &vcpkg-key vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-${{ hashFiles('./native/vcpkg.json', './native/vcpkg-configuration.json', './native/toolchains/linux-*.cmake', '!./native/toolchains/*-asan.cmake', './native/.env', './native/ports/**', './native/cmake/sysroot_gcc_dir.cmake', './sysroot/Dockerfile') }}

      - name: Install vcpkg dependencies
        id: build-vcpkg
        if: steps.restore-vcpkg.outputs.cache-hit != 'true'
        run: just build-vcpkg-deps

      - name: Save vcpkg cache
        if: steps.build-vcpkg.outcome == 'success'
        uses: *cache-save
        with:
          path: *vcpkg-path
          key: *vcpkg-key

      - name: Build pass bundle (dso)
        run: just build-pass-native

      - name: Build JVM SDK
        run: just build-jvm-sdk

      - name: Configure release build
        run: just configure

      - name: Restore pinned vendor inputs
        if: ${{ !env.ACT && matrix.arch == 'x86_64' }}
        id: restore-vendor
        uses: *cache-restore
        with:
          path: &vendor-path |
            spectra/thirdparty/vendor
            spectra/thirdparty/.vendor.downloads
          key: &vendor-key spectra-vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./spectra/cmake/spectra_vendor_versions.cmake', './spectra/cmake/prepare_spectra_vendor_dist.cmake') }}

      - name: Stage and verify pinned vendor inputs
        if: ${{ matrix.arch == 'x86_64' }}
        id: build-vendor
        working-directory: spectra
        run: |
          just build-vendor-libs
          just verify-vendor-libs

      - name: Save pinned vendor inputs
        if: ${{ !env.ACT && matrix.arch == 'x86_64' && steps.restore-vendor.outputs.cache-hit != 'true' && steps.build-vendor.outcome == 'success' }}
        uses: *cache-save
        with:
          path: *vendor-path
          key: *vendor-key

      - name: Build dist
        run: just build-dist

      - name: Build test dist (host profile)
        run: just build-test-dist

      - name: Check artefact
        if: always()
        run: just check-dist-deps native/out/polyregion-Release-${{ matrix.arch }}-dylib-dist

      - name: Upload dist
        if: ${{ !env.ACT }}
        # v4: nektos/act#6022
        uses: *upload
        with:
          name: polyregion-linux-${{ matrix.arch }}-Release
          path: ./native/out/polyregion-Release-${{ matrix.arch }}-dylib-dist/**
          if-no-files-found: error

      - name: Upload the Spectra package
        if: ${{ !env.ACT && matrix.arch == 'x86_64' }}
        id: upload-package
        uses: *upload
        with:
          name: spectra-package
          path: ./native/out/polyregion-Release-x86_64-dylib-dist/lib/polyregion/packages/
          if-no-files-found: error

      - name: Upload test dist
        if: ${{ !env.ACT }}
        # v4: nektos/act#6022
        uses: *upload
        with:
          name: polyregion-tests-linux-${{ matrix.arch }}-Release
          path: ./native/out/polyregion-test-Release-${{ matrix.arch }}-dylib-dist/**
          if-no-files-found: error

      - name: Build test dist (emulators profile)
        env:
          POLYREGION_TEST_PROFILE: emulators
        run: |
          just build-test-dist

      - name: Upload test dist (emulators)
        if: ${{ !env.ACT }}
        uses: *upload
        with:
          name: polyregion-tests-emulators-linux-${{ matrix.arch }}-Release
          path: ./native/out/polyregion-test-Release-${{ matrix.arch }}-dylib-dist/**
          if-no-files-found: error

      - name: List shards
        run: just list-shards emulators > shards.txt

      - name: Upload shards
        if: ${{ !env.ACT }}
        uses: *upload
        with:
          name: polyregion-shards-linux-${{ matrix.arch }}
          path: shards.txt
          if-no-files-found: error

      - name: Stage just
        run: install -D "$(command -v just)" just-dist/just

      - name: Upload just
        if: ${{ !env.ACT }}
        uses: *upload
        with:
          name: just-linux-${{ matrix.arch }}
          path: just-dist/just
          if-no-files-found: error

  discover-shards:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
    steps:
      - name: Download shards
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v8
        with:
          name: polyregion-shards-linux-x86_64
          path: .
      - id: gen
        name: Build shard matrix
        run: |
          if [ -f shards.txt ]; then shards=$(jq -R -s -c '[split("\n")[] | select(length > 0)]' shards.txt); else shards='[]'; fi
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "shards: $shards"
