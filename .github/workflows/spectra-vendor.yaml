name: Spectra vendor

on:
  workflow_call:

defaults:
  run:
    shell: bash
    working-directory: spectra

jobs:
  vendor:
    runs-on: ubuntu-24.04
    steps:
      - uses: &checkout actions/checkout@v6

      - &setup-just
        name: Setup just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Test atomic vendor staging
        run: just test-vendor-staging

      - name: Restore pinned vendor inputs
        if: ${{ !env.ACT }}
        id: restore-vendor
        uses: &cache-restore actions/cache/restore@v5
        with:
          path: &vendor-path |
            spectra/thirdparty/vendor
            spectra/thirdparty/.vendor.downloads
          key: &vendor-key spectra-vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./spectra/cmake/spectra_vendor_versions.cmake', './spectra/cmake/prepare_spectra_vendor_dist.cmake') }}

      - name: Stage and verify pinned vendor inputs
        id: build-vendor
        run: |
          just build-vendor-libs
          just verify-vendor-libs

      - name: Save pinned vendor inputs
        if: ${{ !env.ACT && steps.restore-vendor.outputs.cache-hit != 'true' && steps.build-vendor.outcome == 'success' }}
        uses: &cache-save actions/cache/save@v5
        with:
          path: *vendor-path
          key: *vendor-key

  vendor-smoke:
    needs: vendor
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cuda
            runs_on: ubuntu-24.04
          - backend: hip
            runs_on: ubuntu-24.04
          - backend: onedpl
            runs_on: ubuntu-24.04
          - backend: cuda
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Free up disk space
        if: ${{ !env.ACT }}
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          cleanup-profile: custom
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-dotnet: 'true'

      - uses: *checkout
      - *setup-just

      - name: Restore pinned vendor inputs
        if: ${{ !env.ACT }}
        id: restore-vendor
        uses: *cache-restore
        with:
          path: *vendor-path
          key: *vendor-key

      - name: Stage and verify pinned vendor inputs
        id: build-vendor
        run: |
          just build-vendor-libs
          just verify-vendor-libs

      - name: Save pinned vendor inputs
        if: ${{ !env.ACT && steps.restore-vendor.outputs.cache-hit != 'true' && steps.build-vendor.outcome == 'success' }}
        uses: *cache-save
        with:
          path: *vendor-path
          key: *vendor-key

      - name: Compile ${{ matrix.backend }} vendor headers
        env:
          CONTAINER: docker
        run: just smoke-vendor-containers ${{ matrix.backend }}

      - name: Compile and link all ${{ matrix.backend }} vendor-native cases
        env:
          CONTAINER: docker
        run: just test-vendor-native ${{ matrix.backend }} compile

