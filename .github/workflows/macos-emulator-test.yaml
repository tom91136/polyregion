name: macOS emulator test

on:
  workflow_call:
    inputs:
      shards:
        type: string
        required: true

jobs:
  test-native-misc:
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runs_on: macos-26
          - arch: x86_64
            runs_on: macos-26-intel
    runs-on: ${{ matrix.runs_on }}
    env:
      POLYREGION_ARCH: ${{ matrix.arch }}
      # we may or may not get a paravirtualised Metal device
      POLYRT_STRICT_SELECT: "0"
    steps:
      - uses: &checkout actions/checkout@v6
      - &setup-just
        name: Setup just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - &brew-cmake
        name: Install dependencies
        run: |
          if brew tap | grep -qx 'aws/tap'; then brew untap aws/tap; fi
          brew install --quiet cmake
      - &sdkroot
        name: Pin the SDK to the selected Xcode
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Download dist
        # v4: nektos/act#6022
        uses: &download actions/download-artifact@v8
        with:
          name: polyregion-darwin-${{ matrix.arch }}-Release
          path: ./native/out/polyregion-Release-${{ matrix.arch }}-dylib-dist

      - name: Download test dist (emulators)
        # v4: nektos/act#6022
        uses: *download
        with:
          name: polyregion-tests-emulators-darwin-${{ matrix.arch }}-Release
          path: ./native/out/polyregion-test-Release-${{ matrix.arch }}-dylib-dist

      - name: Download emulators
        uses: *download
        with:
          name: polyregion-emulators-darwin-${{ matrix.arch }}
          path: ./emulators

      - name: Unpack emulators
        run: tar xzf emulators/emulators-out.tar.gz -C emulators

      - name: Restore executable bits
        run: just restore-exec-bits native/out/polyregion-Release-${{ matrix.arch }}-dylib-dist native/out/polyregion-test-Release-${{ matrix.arch }}-dylib-dist

      - name: Run misc tests (non-codegen)
        run: just test-native-dist emulators misc-test-results -LE codegen --repeat until-pass:3

      - name: Annotate ctest results
        if: always()
        uses: ./.github/actions/annotate-junit
        with:
          junit: native/out/polyregion-test-Release-${{ matrix.arch }}-dylib-dist/misc-test-results.xml
          label: ctest-misc

      - name: Upload test results
        if: always()
        # v4: nektos/act#6022
        uses: &upload actions/upload-artifact@v7
        with:
          name: misc-test-results-darwin-${{ matrix.arch }}-Release
          path: ./native/out/polyregion-test-Release-${{ matrix.arch }}-dylib-dist/misc-test-results.xml
          if-no-files-found: warn

      # always() not failure(): --repeat until-pass recovers transient crashes, but the OS still logged them
      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p crash-reports
          cp -f ~/Library/Logs/DiagnosticReports/*.ips crash-reports/ 2>/dev/null || true
          cp -f /Library/Logs/DiagnosticReports/*.ips crash-reports/ 2>/dev/null || true
          ls -la crash-reports || true
      - name: Upload crash reports
        if: ${{ always() && !env.ACT }}
        uses: *upload
        with:
          name: crash-reports-misc-darwin-${{ matrix.arch }}-Release
          path: crash-reports/
          if-no-files-found: ignore

  test-native-with-emulators:
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
        shard: ${{ fromJSON(inputs.shards) }}
    runs-on: ${{ matrix.arch == 'x86_64' && 'macos-26-intel' || 'macos-26' }}
    env:
      POLYREGION_ARCH: ${{ matrix.arch }}
      POLYRT_STRICT_SELECT: "0"
    steps:
      - uses: *checkout
      - *setup-just
      - *brew-cmake
      - *sdkroot

      - name: Download dist
        uses: *download
        with:
          name: polyregion-darwin-${{ matrix.arch }}-Release
          path: ./native/out/polyregion-Release-${{ matrix.arch }}-dylib-dist

      - name: Download test dist (emulators)
        uses: *download
        with:
          name: polyregion-tests-emulators-darwin-${{ matrix.arch }}-Release
          path: ./native/out/polyregion-test-Release-${{ matrix.arch }}-dylib-dist

      - name: Download emulators
        uses: *download
        with:
          name: polyregion-emulators-darwin-${{ matrix.arch }}
          path: ./emulators

      - name: Unpack emulators
        run: tar xzf emulators/emulators-out.tar.gz -C emulators

      - name: Restore executable bits
        run: just restore-exec-bits native/out/polyregion-Release-${{ matrix.arch }}-dylib-dist native/out/polyregion-test-Release-${{ matrix.arch }}-dylib-dist

      - name: Run emulator tests (${{ matrix.shard }})
        run: |
          repeat=()
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            repeat=(--repeat until-pass:5)
          fi
          just test-native-dist emulators emulator-test-results-${{ matrix.shard }} -L "^${{ matrix.shard }}$" --no-tests=error "${repeat[@]}"

      - name: Annotate ctest results
        if: always()
        uses: ./.github/actions/annotate-junit
        with:
          junit: native/out/polyregion-test-Release-${{ matrix.arch }}-dylib-dist/emulator-test-results-${{ matrix.shard }}.xml
          label: ctest-emulators-${{ matrix.shard }}

      - name: Upload test results
        if: always()
        uses: *upload
        with:
          name: emulator-test-results-darwin-${{ matrix.arch }}-${{ matrix.shard }}-Release
          path: ./native/out/polyregion-test-Release-${{ matrix.arch }}-dylib-dist/emulator-test-results-${{ matrix.shard }}.xml
          if-no-files-found: warn

      - name: Collect crash reports
        if: failure()
        run: |
          sleep 5
          mkdir -p crash-reports
          cp -f ~/Library/Logs/DiagnosticReports/*.ips crash-reports/ 2>/dev/null || true
          cp -f /Library/Logs/DiagnosticReports/*.ips crash-reports/ 2>/dev/null || true
          ls -la crash-reports || true

      - name: Upload crash reports
        if: ${{ failure() && !env.ACT }}
        uses: *upload
        with:
          name: crash-reports-darwin-${{ matrix.arch }}-${{ matrix.shard }}-Release
          path: crash-reports/
          if-no-files-found: ignore
