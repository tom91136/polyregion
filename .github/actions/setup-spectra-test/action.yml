name: Setup Spectra test
description: Install the build tools and download the dist, the Spectra package, and optionally the emulator bundle.

inputs:
  os:
    description: linux, darwin, or windows.
    required: true
  arch:
    description: Architecture of the dist and emulator artifacts.
    required: true
  emulators:
    description: Download and unpack the emulator bundle.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-just

    - name: Setup Ninja
      if: ${{ inputs.os != 'windows' }}
      shell: bash
      env:
        HOMEBREW_CURL_RETRIES: 5
      run: |
        if [ "$RUNNER_OS" = Linux ]; then
          sudo apt-get -qq -o Acquire::Retries=10 -o Acquire::Retries::Delay::Maximum=60 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ninja-build
        else
          brew install --quiet ninja
        fi

    - name: Pin the SDK to the selected Xcode
      if: ${{ inputs.os == 'darwin' }}
      shell: bash
      run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

    - name: Setup MSVC env
      if: ${{ inputs.os == 'windows' }}
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $inst    = & $vswhere -latest -products * -property instanceId      | Select-Object -First 1
        $install = & $vswhere -latest -products * -property installationPath | Select-Object -First 1
        if (-not $inst) { throw 'vswhere: no Visual Studio installation found' }
        $pin = (Get-Content -Raw (Join-Path $env:GITHUB_WORKSPACE 'native\msvc-toolset')).Trim()
        if (-not $pin) { throw 'native/msvc-toolset is empty' }
        Import-Module (Join-Path $install 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
        $before = @{}
        Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
        Enter-VsDevShell -VsInstanceId $inst -SkipAutomaticLocation -DevCmdArguments "-arch=${{ inputs.arch }} -no_logo -vcvars_ver=$pin" | Out-Null
        if (-not $env:VSCMD_ARG_TGT_ARCH) { throw 'VsDevShell did not initialise (no VSCMD_ARG_TGT_ARCH)' }
        if ($env:VCToolsVersion -notlike "$pin.*") { throw "VsDevShell toolset '$env:VCToolsVersion' is not the pinned $pin" }
        Get-ChildItem env: | Where-Object { $before[$_.Name] -ne $_.Value } | ForEach-Object {
          "$($_.Name)=$($_.Value)" | Out-File -FilePath $env:GITHUB_ENV -Append
        }

    - name: Download Polyregion
      if: ${{ !env.ACT }}
      uses: actions/download-artifact@v8
      with:
        name: polyregion-${{ inputs.os }}-${{ inputs.arch }}-Release
        path: ${{ github.workspace }}/dist

    - name: Download the package
      if: ${{ !env.ACT }}
      uses: actions/download-artifact@v8
      with:
        name: spectra-package
        path: package

    - name: Download emulators
      if: ${{ inputs.emulators == 'true' && !env.ACT }}
      uses: actions/download-artifact@v8
      with:
        name: polyregion-emulators-${{ inputs.os }}-${{ inputs.arch }}
        path: emulators

    - name: Unpack emulators
      if: ${{ inputs.emulators == 'true' && !env.ACT }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: tar xzf emulators/emulators-out.tar.gz -C emulators

    # XXX act has no artifacts; link the paths the downloads would have created to the bound workspace
    - name: Link artifacts from the bound workspace
      if: ${{ env.ACT }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        dist="$PWD/native/out/polyregion-Release-${{ inputs.arch }}-dylib-dist"
        ln -sfnT "$dist" dist
        ln -sfnT "$dist/lib/polyregion/packages" package

    - name: Restore executable bits
      shell: bash
      working-directory: ${{ github.workspace }}
      run: just restore-exec-bits "${{ github.workspace }}/dist"
