name: Annotate JUnit test results
description: Emit GitHub Actions error annotations for failed tests in JUnit XML (file or directory).

inputs:
  junit:
    description: Path or recursive glob for JUnit XML files or report directories.
    required: true
  label:
    description: Short label for the annotations (e.g. ctest, scala).
    required: false
    default: tests

runs:
  using: composite
  steps:
    - shell: bash
      env:
        JUNIT: ${{ inputs.junit }}
        LABEL: ${{ inputs.label }}
        SCRIPT: ${{ github.action_path }}/../../scripts/junit_summary.py
      run: |
        py=$(command -v python3 || command -v python) || { echo "::warning::no python to parse $LABEL results"; exit 0; }
        "$py" -I "$SCRIPT" annotate "$JUNIT" "$LABEL"
