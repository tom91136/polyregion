# neither module builds with the current toolchain
excluded-modules = [benchmarks-scala, compiler-testsuite-java]

# the read and write sides of each capture binding mirror one another
intended = ["polyregion.scalalang.compiletime=polyregion.scalalang.compiletime"]

projects {
  # the harness evaluates each expression on both the host and the device
  compiler-testsuite-scala.disabled = [inline-parameter-reuse]
  compiler {
    # published API, and the prism and intrinsic tables are matched by name
    library = true
    # the javac plugin has no supported alternative to these JDK internals
    disabled = [jdk-internal]
  }
  runtime-scala.library = true
  # AST paths and cleanup lists are bounded by struct and scope nesting
  pass.disabled = [linear-in-loop]
  passJS.disabled = [linear-in-loop]
  passNative.disabled = [linear-in-loop]
}
